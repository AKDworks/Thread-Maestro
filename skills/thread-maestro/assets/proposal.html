<div id="{{ROOT_ID}}">
  <style>
    #{{ROOT_ID}} {
      --tm-panel: light-dark(#f4f4f4, #191919);
      --tm-card: light-dark(#ffffff, #111111);
      --tm-text: light-dark(#202020, #eeeeee);
      --tm-muted: light-dark(#626262, #ababab);
      --tm-border: light-dark(#d9d9d9, #333333);
      --tm-selected: light-dark(#e5e5e5, #333333);
      color: var(--tm-text);
      font-family: inherit;
      font-size: 14px;
      line-height: 1.5;
      width: 100%;
    }
    #{{ROOT_ID}} * { box-sizing: border-box; }
    #{{ROOT_ID}} [hidden] { display: none !important; }
    #{{ROOT_ID}} .tm-counts { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
    #{{ROOT_ID}} .tm-count-label { color: var(--tm-muted); margin-right: 6px; }
    #{{ROOT_ID}} .tm-count { min-width: 44px; min-height: 44px; padding: 8px 14px; border: 1px solid var(--tm-border); border-radius: 9px; background: var(--tm-card); color: var(--tm-text); font: inherit; }
    #{{ROOT_ID}} .tm-count[aria-pressed="true"] { background: var(--tm-selected); }
    #{{ROOT_ID}} .tm-panel { padding: 12px; border: 1px solid var(--tm-border); border-radius: 18px; background: var(--tm-panel); }
    #{{ROOT_ID}} .tm-card { min-width: 0; min-height: 104px; padding: 18px 12px; border-radius: 12px; background: var(--tm-card); text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
    #{{ROOT_ID}} .tm-icon { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; margin-bottom: 2px; }
    #{{ROOT_ID}} .tm-icon svg { width: 20px; height: 20px; stroke-width: 1.7; }
    #{{ROOT_ID}} .tm-title { font-weight: 500; overflow-wrap: anywhere; }
    #{{ROOT_ID}} .tm-description { color: var(--tm-muted); font-size: 12px; overflow-wrap: anywhere; }
    #{{ROOT_ID}} .tm-connector { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px 0; color: var(--tm-muted); font-size: 12px; }
    #{{ROOT_ID}} .tm-connector .tm-icon { width: 16px; height: 16px; margin: 0; }
    #{{ROOT_ID}} .tm-connector svg { width: 14px; height: 14px; }
    #{{ROOT_ID}} .tm-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    #{{ROOT_ID}}[data-chat-count="7"] .tm-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    @media (max-width: 600px) { #{{ROOT_ID}}[data-chat-count="7"] .tm-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 390px) { #{{ROOT_ID}} .tm-grid, #{{ROOT_ID}}[data-chat-count="7"] .tm-grid { grid-template-columns: 1fr; } }
  </style>
  <div class="tm-counts" hidden></div>
  <div class="tm-panel">
    <div class="tm-main"></div>
    <div class="tm-connector" aria-hidden="true">
      <span class="tm-icon"><i data-lucide="arrow-down"></i></span>
      <span class="tm-group-label"></span>
    </div>
    <div class="tm-grid"></div>
  </div>
  <script>
    (() => {
      const root = document.getElementById('{{ROOT_ID}}');
      const plan = {{PLAN_JSON}};
      const totals = Object.keys(plan.variants).map(Number);
      if (!totals.length || totals.some(n => ![3, 5, 7].includes(n))) throw new Error('Supported totals: 3, 5, 7.');
      for (const n of totals) {
        const v = plan.variants[n];
        if (!v.main || !Array.isArray(v.specialists) || v.specialists.length !== n - 1) throw new Error('Card count must match the selected total.');
      }
      const main = root.querySelector('.tm-main');
      const grid = root.querySelector('.tm-grid');
      const controls = root.querySelector('.tm-counts');
      const groupLabel = root.querySelector('.tm-group-label');
      const buttons = [];
      groupLabel.textContent = plan.groupLabel;

      function card(data) {
        const element = document.createElement('div');
        element.className = 'tm-card';
        const icon = document.createElement('span');
        icon.className = 'tm-icon';
        icon.setAttribute('aria-hidden', 'true');
        const glyph = document.createElement('i');
        glyph.setAttribute('data-lucide', data.icon || 'messages-square');
        icon.append(glyph);
        const title = document.createElement('div');
        title.className = 'tm-title';
        title.textContent = data.title;
        const description = document.createElement('div');
        description.className = 'tm-description';
        description.textContent = data.description;
        element.append(icon, title, description);
        return element;
      }

      function render(total) {
        if (!totals.includes(total)) return;
        root.dataset.chatCount = String(total);
        const variant = plan.variants[total];
        main.replaceChildren(card(variant.main));
        grid.replaceChildren(...variant.specialists.map(card));
        buttons.forEach(button => button.setAttribute('aria-pressed', String(Number(button.dataset.total) === total)));
        if (globalThis.lucide) globalThis.lucide.createIcons({ attrs: { width: 20, height: 20 } });
      }

      if (totals.length > 1) {
        controls.hidden = false;
        controls.setAttribute('role', 'group');
        controls.setAttribute('aria-label', plan.countLabel);
        const label = document.createElement('span');
        label.className = 'tm-count-label';
        label.textContent = plan.countLabel;
        controls.append(label);
        for (const total of totals.sort((a, b) => a - b)) {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'tm-count';
          button.textContent = String(total);
          button.dataset.total = String(total);
          button.setAttribute('aria-pressed', 'false');
          button.addEventListener('click', () => {
            render(total);
            if (window.openai?.setWidgetState) window.openai.setWidgetState({ modelContent: { preview_chat_count: total, proposal_only: true }, privateContent: { previewCount: total } }).catch(() => {});
          });
          buttons.push(button);
          controls.append(button);
        }
      }
      const saved = window.openai?.widgetState?.privateContent?.previewCount;
      render(totals.includes(saved) ? saved : (totals.includes(plan.selected) ? plan.selected : totals[0]));
      window.addEventListener('openai:set_globals', event => {
        const count = event.detail?.globals?.widgetState?.privateContent?.previewCount;
        if (totals.includes(count)) render(count);
      });
    })();
  </script>
</div>
