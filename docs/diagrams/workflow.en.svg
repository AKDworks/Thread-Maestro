<svg xmlns="http://www.w3.org/2000/svg" width="960" height="382" viewBox="0 0 960 382" role="img" aria-labelledby="title desc" xml:lang="en"><title id="title">Starting a new project</title><desc id="desc">Describe an idea, choose the chats, agree on the structure, and set up a new project.</desc><rect x="1" y="1" width="958" height="380" rx="14" fill="#191919" stroke="#393939"/><path d="M54 56V308" fill="none" stroke="#4c4c4c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="54" cy="56" r="18" fill="#191919" stroke="#666666" stroke-width="1.5"/><text x="54" y="61" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#b6b6b6" text-anchor="middle">1</text><text x="94" y="63" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#eeeeee" text-anchor="start">Your idea</text><text x="94" y="93" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#b6b6b6" text-anchor="start">Describe what you want to build.</text><path d="M94 116H928" fill="none" stroke="#303030" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="54" cy="140" r="18" fill="#191919" stroke="#666666" stroke-width="1.5"/><text x="54" y="145" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#b6b6b6" text-anchor="middle">2</text><text x="94" y="147" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#eeeeee" text-anchor="start">Chat structure</text><text x="94" y="177" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#b6b6b6" text-anchor="start">It suggests how many chats to use and what each is for.</text><path d="M94 200H928" fill="none" stroke="#303030" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="54" cy="224" r="18" fill="#191919" stroke="#666666" stroke-width="1.5"/><text x="54" y="229" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#b6b6b6" text-anchor="middle">3</text><text x="94" y="231" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#eeeeee" text-anchor="start">Review together</text><text x="94" y="261" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#b6b6b6" text-anchor="start">You can change the names and topics before agreeing.</text><path d="M94 284H928" fill="none" stroke="#303030" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="54" cy="308" r="18" fill="#191919" stroke="#78cfa3" stroke-width="1.5"/><text x="54" y="313" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#78cfa3" text-anchor="middle">4</text><text x="94" y="315" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#78cfa3" text-anchor="start">Project setup</text><text x="94" y="345" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#b6b6b6" text-anchor="start">The project folder and agreed chats.</text></svg>
